services:
  postgres:
    container_name: postgres
    image: postgres:17.4-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tutor-dash-backend

volumes:
  postgres_data:

networks:
  tutor-dash-backend:
